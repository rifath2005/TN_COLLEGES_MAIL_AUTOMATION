[build]
  base = "AUTO_LAND"
  publish = "dist"
  command = "npm run build"

# Netlify Single Page Application (SPA) Routing Rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Backend API Proxy (Uncomment and replace with your backend deployment URL on Render/Railway/VPS):
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-service.onrender.com/api/:splat"
#   status = 200
#   force = true
